name: Check Geek News freshness

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'
      timezone: 'Europe/Kyiv'

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_freshness.py
