name: Publish Geek News

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'
      timezone: 'Europe/Kyiv'
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-news.yml
      - scripts/**
      - config/**
      - tests/**

concurrency:
  group: geek-news-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test and validate current feed
        run: |
          python -m unittest discover -s tests -v
          python scripts/feed.py validate
      - name: Build candidate edition
        id: build
        continue-on-error: true
        run: python scripts/feed.py build
      - name: Publish failure diagnostics
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          cp .feed-run-status.json news/status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add news/status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record failed Geek News build diagnostics'
            git push origin HEAD:main
          fi
          echo 'Edition build failed; previous latest.json was preserved' >&2
          exit 1
      - name: Publish both JSON files together
        if: steps.build.outcome == 'success'
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f news/status.json
          git add news/latest.json news/archive/
          if git ls-files --error-unmatch news/status.json >/dev/null 2>&1; then
            git add -u -- news/status.json
          fi
          if git diff --cached --quiet; then
            echo 'No changed edition'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          edition_date=$(python -c 'import json; print(json.load(open("news/latest.json"))["date"])')
          git commit -m "Publish Geek News edition $edition_date"
          if ! git push origin HEAD:main; then
            git fetch origin main
            git rebase FETCH_HEAD
            git push origin HEAD:main
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify public TUI URL
        run: |
          python - <<'PY'
          import json, pathlib, time, urllib.request
          expected = pathlib.Path('news/latest.json').read_bytes()
          date = json.loads(expected)['date']
          base = 'https://raw.githubusercontent.com/glebone/geek_news/main/news/'
          for attempt in range(36):
              try:
                  actual = []
                  for path in ('latest.json', f'archive/{date}.json'):
                      request = urllib.request.Request(base + path, headers={'Cache-Control': 'no-cache'})
                      with urllib.request.urlopen(request, timeout=15) as response:
                          actual.append(response.read())
                  if actual == [expected, expected]:
                      print('Public latest and archive match committed edition')
                      break
              except Exception as exc:
                  print(f'Public verification attempt {attempt + 1}: {type(exc).__name__}')
              if attempt == 35:
                  raise SystemExit('Public latest or archive did not match edition after retries')
              time.sleep(20)
          PY
